# INOCULUM STUDIES
# ---

# This is a NovaSeq study unlike all others which are MiSeq
swift2024drought:
  doi: "10.1007/s11104-024-06853-x"
  full_name: "Swift et al. (2024)"
  amplicon_length: 250
  filters:
    # discard slurry samples (analysis done in the study shows they are very similar to the soil samples)
    - "lambda row: 'slurry' not in str(row['Env Medium [sample]'])"
    # keep only late harvest as done in the paper
    - "lambda row: str(row['Harvest Time Point [sample]']) == 'late' or pd.isna(row['Harvest Time Point [sample]'])"
    # Remove ITS samples (these are only labelled for the inoculum samples)
    # For the thers we have to remove post-processing
    - "lambda row: 'ITS' not in str(row['Title'])"
    # Keep only driest and wettest inocula
    - "lambda row: str(row['Soil Inoculum [sample]']) != 'HAY'"
    - "lambda row: str(row['Soil Inoculum [sample]']) != 'TLI'"
  inoculum_col: "Soil Inoculum [sample]"
  # Separate based on precipitation gradient in the paper
  inocula:
    "SVR": "DroughtLegacy"
    #"HAY": "DroughtLegacy"
    #"TLI": "Control"
    "KNZ": "Control"
    "Control": "Sterile"
  treatment_col: "Drought or Watered"
  treatments:
    "D": "Drought"
    "W": "Control"
  host_col: "Host [sample]"
  hosts:
    "Zea mays": "PACMAD clade"
  hosts_ungrouped:
    "Zea mays": "Zea mays"
  # whether the sample represent an inoculum sample or is plant-associated
  is_plant_associated_col: "Env Medium [sample]"
  is_plant_associated:
    "plant matter": "Yes"
    "soil*": "No"
  root_compartment_col: "Env Medium [sample]"
  root_compartments:
    "plant matter": "Endosphere"
    "soil*": "Bulk soil"
  link_NCBI_metadata: "Title"
  link_supplemental_metadata: "RepID"

moore2023microbial:
  doi: "10.1128/spectrum.01476-22"
  full_name: "Moore et al. (2023)"
  amplicon_length: 300
  treatment_col: "Water Content Soil [sample]"
  treatments:
    "Well-watered": "Control"
    "Water-limited": "Drought"
  # Dummy column since host s not included so we take it from the paper
  host_col: "Env Local Scale [sample]"
  hosts:
    "Pot": "PACMAD clade"
  hosts_ungrouped:
    "Pot": "Zea mays"
  inoculum_col: "Env Medium [sample]"
  inocula:
    "Inoculum: Agricultural_field": "Control"
    "Inoculum: Forest_soil": "DroughtLegacy"
  # Only one type
  is_plant_associated_col: "Env Broad Scale [sample]"
  is_plant_associated:
    "Greenhouse": "Yes"
  link_NCBI_metadata: "Title"
  link_supplemental_metadata: "Sample_ID"
  root_compartment_col: "Env Local Scale [sample]"
  root_compartments:
    "Pot": "Bulk soil"

