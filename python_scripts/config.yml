zhang2022cross:
  doi: "10.1111/tpj.15775"
  full_name: "Zhang et al. (2022)"
  amplicon_length: 250
  filters:
    # Remove fungal samples
    - "lambda row: 'F' not in str(row['Name'])"
    - "lambda row: 'Neg' not in str(row['Name'])"
  treatment_col: "Name"
  treatments:
    ".*W.*": "Control"
    ".*D.*": "Drought"
    ".*I.*": "None"
  # Dummy column
  host_col: "Organism"
  hosts:
    "soil metagenome": "PACMAD clade"
  hosts_ungrouped:
    "soil metagenome": "Zea mays"
  inoculum_col: "Name"
  inocula:
    "^A.*": "DroughtLegacy"
    "^O.*": "Control"
  is_plant_associated_col: "Name"
  is_plant_associated:
    ".*I.*": "No"
    # Does not contain I
    "^[^I]*$": "Yes"
  root_compartment_col: "Organism"
  root_compartments:
    "soil metagenome": "Rhizosphere"
  custom_processing: "process_per_study.process_zhang2022cross"

