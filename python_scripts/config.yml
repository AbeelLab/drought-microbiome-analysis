data_path: "../data"
plotting_dir: "../data/plots"
processed_files: "processed_files.yml"

levels:
  2: "phylum"
  3: "class"
  4: "order"
  5: "family"
  6: "genus"

inoculum_studies:
  - "yue2024host"
  - "moore2023microbial"
  - "munoz-ucros2021drought"
  - "zhang2022cross"
  - "swift2024drought"

drought_studies:
  - "xu2018drought"
  - "santos-medellin2021prolonged"
  - "simmons2020drought"
  - "kristy2022chronic"
  - "fitspatrick2017assembly"
  - "hoefle2024oak"
  - "bandopadhyay2024disentangling"
  - "santos-medellin2017drought"
  - "faist2022potato"
  - "azarbad2020four"

# All studies and attributes
yue2024host:
  inoculum_col_name: "Geo Loc Name [sample]"
  normal_inoculum: "China:Suqian City, Jiangsu Province"
  dry_inoculum: "China:Yangli City, Shaanxi Province"
    
moore2023microbial:
  inoculum_col_name: "Env Medium [sample]"
  normal_inoculum: "Inoculum: Agricultural_field"
  dry_inoculum: "Inoculum: Forest_soil"
    
munoz-ucros2021drought:
  inoculum_col_name: "Microbiome [sample]"
  normal_inoculum: "WET"
  dry_inoculum: "DRY"
    
zhang2022cross: "No data"

xu2018drought:
  amplicon_length: 300
  filters:
    # Remove bulk soil samples
    # For large experiment
    - "lambda row: 'Soil' not in str(row['Env Material [sample]'])"
    # For smaller experiment (reproduction)
    - "lambda row: 'bulk soil' not in str(row['Env Medium [sample]'])"

    # Keep only Post-flowering, Pre-flowering, Control, Drought, Water
    # I am not sure what positive means
    # (for the large experiment)
    - "lambda row: 'Positive' not in str(row['Env Material [sample]'])"

santos-medellin2021prolonged:
  amplicon_length: 250
  filters: {}
  
kristy2022chronic:
  amplicon_length: 250
  filters:
    # Remove fungal samples
    - "lambda row: str(row['Marker Gene [sample]']) == '16s'"
    # Remove bulk soil samples
    - "lambda row: 'bulksoil' not in str(row['Name'])"
  treatment_col: "Watering Regm [sample]"
  drought: "reduced"
  watered: "full"
  
hoefle2024oak:
  amplicon_length: 300
  filters:
    # Keep heat samples as well
    # Remove phyllosphere samples
    - "lambda row: str(row['Env Local Scale [sample]']) == 'rhizosphere'"
    # Remove fungal samples
    - "lambda row: 'fungi' not in str(row['Name'])"
  treatment_col: "Climate Environment [sample]"
  drought: "soil moisture 15%"
  watered: "soil moisture 60%"
  
bandopadhyay2024disentangling:
  amplicon_length: 300
  filters:
    # Remove unplanted (no host)
    - "lambda row: 'unplanted' not in str(row['Env Local Scale [sample]'])"
    # Remove pre-drought
    - "lambda row: 'pre-drought' not in str(row['Treatment [sample]'])"
  treatment_col: "Treatment [sample]"
  drought: "drought"
  watered: "well-watered"
  
santos-medellin2017drought:
  amplicon_length: 250
  filters:
    # Remove bulk soil samples
    - "lambda row: str(row['Root Compartment [sample]']) != 'BulkSoil'"
  treatment_col: "Watering Regm [sample]"
  drought: "Drought"
  watered: "Watered"

faist2022potato:
  amplicon_length: 300
  filters:
    # Remove fungal samples
    - "lambda row: 'fungi' not in str(row['Library Name'])"
    # Remove mock community samples
    - "lambda row: 'mock community' not in str(row['Name'])"
  treatment_col: "Watering Regm [sample]"
  drought: "drought"
  watered: "irrigated"
  
azarbad2020four:
  amplicon_length: 250
  filters:
    # Remove fungal samples
    - "lambda row: 'ITS' not in str(row['Name'])"
    # Remove leaf samples
    - "lambda row: 'LEAF' not in str(row['Library Name'])"
    - "lambda row: 'Leaf' not in str(row['Library Name'])"
  treatment_col: "Title"
  drought: "int(str(row['Title']).split(\"_\")[3]) < 20"
  watered: "int(str(row['Title']).split(\"_\")[3]) >= 20"
    
simmons2020drought:
  amplicon_length: 300
  filters:
    # Remove bulk soil samples
    - "lambda row: str(row['Isolation Source [sample]']) != 'soil'"
  treatment_col: "Treatment_all"
  drought: "Drought"
  watered: "Watered"
  link_NCBI_metadata: "Name"
  link_supplemental_metadata: "SampleID"

fitspatrick2017assembly:
  amplicon_length: 150
  filters:
    # Remove bulk soil samples
    - "lambda row: str(row['Isolation Source [sample]']) != 'live bare soil'"
    # Remove samples without plant roots
    - "lambda row: 'analogue' not in str(row['Isolation Source [sample]'])"
    # Remove samples without treatment recorded (NA in supplemental file)
    # These should probably alreayd be removed by the previous filters
    - "lambda row: str(row['treatment']) != 'NA'"
  treatment_col: "treatment"
  drought: "d"
  watered: "w"
  link_NCBI_metadata: "Name"
  # This was actually a column with no name which I renamed ID
  link_supplemental_metadata: "Sample_ID"
