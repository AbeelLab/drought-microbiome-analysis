# SOME DOCUMENTATION
# Hosts mapped to "None" were grouped into small clades and were deleted.

# "location" indicates where the soil was sampled from.
# This means that greenhouse-grown communities still get mapped to a location as long as the soil wasourced from a field.
# link_NCBI_metadata and link_supplemental_metadata provide a way to connect the NCBI metadata table with the supplement provided by the authors (for some studies)

data_path: "../data"
plotting_dir: "../data/plots"
processed_drought_datasets: "processed_drought_datasets.pkl"
processed_inoculum_datasets: "processed_inoculum_datasets.pkl"

levels:
  2: "phylum"
  3: "class"
  4: "order"
  5: "family"
  6: "genus"

inoculum_studies:
  - "swift2024drought"
  - "moore2023microbial"
  - "munoz-ucros2021drought"
  - "zhang2022cross"

positive_inoculum_studies:
  - "moore2023microbial"
  - "zhang2022cross"

negative_inoculum_studies:
  - "munoz-ucros2021drought"
  - "swift2024drought"

drought_studies:
  - "azarbad2022response"
  - "santos-medellin2021prolonged"
  - "simmons2020drought"
  - "fitspatrick2018assembly"
  - "santos-medellin2017drought"
  - "azarbad2020four"
  - "naylor2017drought"
  - "xu2018drought"
  - "bandopadhyay2024disentangling"

# DROUGHT STUDIES
# ---

xu2018drought:
  full_name: "Xu et al. (2018)"
  doi: "10.1073/pnas.1717308115"
  amplicon_length: 300
  filters:
    - "lambda row: 'Positive' not in str(row['Env Material [sample]'])"
    - "lambda row: 'NovaSeq' not in str(row['Instrument'])"
    # Cannot discern what the other experiments are
    - "lambda row: str(row['Host [sample]']) == 'Sorghum bicolor'"
  treatment_col: "Treatment [sample]"
  treatments:
    "Pre_flowering": "Pre_flowering"
    "Post_flowering": "Post_flowering"
    "Control": "Control"
    # These correspond to the second field experiment (accession PRJNA435643)
    "Water": "Control"
    "Drought": "Drought"
  host_col: "Host [sample]"
  hosts:
    "Sorghum bicolor": "PACMAD clade"
  hosts_ungrouped:
    "Sorghum bicolor": "Sorghum bicolor"
  root_compartment_col: "Env Material [sample]"
  root_compartments:
    "Rhizosphere": "Rhizosphere"
    "Root": "Endosphere"
    "Soil": "Bulk soil"
  location: "California"
  soil_type: "Field"
  primers: "341F,785R"
  regions: "V3-V4"
  custom_processing: "process_per_study.process_xu2018drought"

